[env]
env = dev

[mode]
mode = replay

[network_policy]
allow_network = false
allow_hosts =
http_timeout_ms = 0

[credential_policy]
source = none
allowed_keys =

[data_policy]
allow_local_fs = true
allow_objstore = false
allow_pg = false

[defaults]
adn03_stale_min = 5
adn09_kill_switch_semantics = no_new_no_close
