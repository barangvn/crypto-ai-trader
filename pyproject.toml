[project]
name = "crypto-ai-trader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "contract: Contract compliance tests",
    "failure_injection: Network/credential safety tests",
    "replay: Replay determinism tests",
]
