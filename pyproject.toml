[project]
name = "crypto-ai-trader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
eapi = [
    "fastapi==0.141.1",
    "uvicorn>=0.34",
    "prometheus-client>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "rollback_*.py", "cap5_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "contract: Contract compliance tests",
    "failure_injection: Network/credential safety tests",
    "replay: Replay determinism tests",
]
