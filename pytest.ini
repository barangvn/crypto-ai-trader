[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py rollback_*.py cap5_*.py
addopts = -ra --strict-markers
markers =
    contract: Contract compliance tests (S-FND-03 CAP-15 stable marker ID)
    replay: Replay determinism tests (S-FND-03 CAP-15 stable marker ID)
    failure_injection: Network/credential safety tests (S-FND-03 CAP-15 stable marker ID)
    F1: no-network — any socket/http/grpc/aiohttp network call is FAIL_CLOSED inside marked tests (S-FND-01)
    F2: no-credentials — any API key / secret / token read from env/files is FAIL_CLOSED inside marked tests (S-FND-01)
    F3: no-live-env — tests marked F3 run ONLY on env=DEV or env=TEST; STG/PROD auto-skip with explicit S-FND-01 reason (S-FND-01)
    F4: stdlib-only — sys.modules contains NO 3rd-party (fastapi/uvicorn/prometheus_client/sklearn/pyyaml/vault/psycopg) inside marked tests; otherwise FAIL_CLOSED (S-FND-01)
